[project]
name = "customer-engagement-assistant"
version = "0.1.0"
description = "Customer Loyalty and Engagement Assistant — HCLTech Hackathon Use Case 5"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy>=2",
    "pandas",
    "pyyaml",
    "jinja2",
    "httpx",
    "streamlit",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
# Add exactly one LLM provider SDK once the team picks the LLM provider.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM provider (needs API key)"]
